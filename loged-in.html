<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout Modal</title>
<link rel="stylesheet" href="./css/loged-in.css">
</head>

<body>

<section class="logout-section">

  <div class="logout-card">

    <div class="icon-circle">
     <img src="./images/loged-in-leaf.png" alt="icon">

    </div>

    <h2>Logout Better Being?</h2>

    <hr>

    <h3>Are you sure you want to log out of <b>Better Being?</b></h3>

    <p>
      You’ll need to sign back in to access your personalized wellness dashboard,
      saved articles, and community features.
    </p>

    <div class="btn-group">
      <button class="logout-btn">Logout</button>
      <button class="stay-btn">Stay Login</button>
    </div>

  </div>

</section>

</body>
</html>
