<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <section class="dashboard-sec cmn-gap">
  <div class="container">

    <div class="child-dashboard">

      <!-- decorative images -->
      <div class="leaf-image">
        <img src="./images/loged-in/left-side-leaf.png" alt="">
      </div>

      <div class="bottom-leaf-image">
        <img src="./images/loged-in/right-side-leaf.png" alt="">
      </div>

      <!-- header -->
      <div class="dashboard-head">
        <figure class="profile-img">
          <img src="./images/loged-in/arushi-pic.png" alt="">
        </figure>

        <h2>Arushi Sharma</h2>

        <div class="dashboard-buttons">
          <button class="btn-switch">Switch account</button>
          <button class="btn-logout">Log out</button>
        </div>
      </div>

      <!-- stats -->
      <div class="stats-row">

        <div class="stat-box">
          <p>Saved Blogs</p>
          <span>12</span>
        </div>

        <div class="stat-box">
          <p>Blogs Read</p>
          <span>12</span>
        </div>

        <div class="stat-box">
          <p>FAQ Activity</p>
          <span>9</span>
        </div>

      </div>

      <!-- menu list -->
      <ul class="dashboard-menu">
        <li>Liked Blogs</li>
        <li>Your Comments</li>
        <li>Shared Blogs</li>
        <li>Contact Better Being</li>
        <li>Notifications</li>
        <li>Terms & Conditions</li>
      </ul>

    </div>

  </div>
</section>
</body>
</html>
