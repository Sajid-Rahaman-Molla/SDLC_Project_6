<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <section class="dashboard-sec cmn-gap">
  <div class="container">

    <div class="child-dashboard">

      <!-- decorative images -->
      <div class="leaf-image">
        <img src="./images/loged-in/left-side-leaf.png" alt="">
      </div>

      <div class="bottom-leaf-image">
        <img src="./images/loged-in/right-side-leaf.png" alt="">
      </div>

      <!-- header -->
      <div class="dashboard-head">
        <figure class="profile-img">
          <img src="./images/loged-in/arushi-pic.png" alt="">
        </figure>

        <h2>Arushi Sharma</h2>

       
         <div class="dashboard-buttons">

          <button class="btn-switch">
            <img src="./images/loged-in/exchange-img.png">
            Switch account
          </button>

          <button class="btn-logout">
            <img src="./images/loged-in/logout-im.png">
            Log out
          </button>

        </div>
      </div>

      <!-- stats -->
      <div class="stats-row">

        <div class="stat-box">
          <img src="./images/loged-in/bookmark-img.jpg">
          <p>Saved Blogs</p>
          <span>12</span>
        </div>

        <div class="stat-box">
          <img src="./images/loged-in/book-img.jpg">
          <p>Blogs Read</p>
          <span>12</span>
        </div>

        <div class="stat-box">
          <img src="./images/loged-in/Faq-img.png">
          <p>FAQ Activity</p>
          <span>9</span>
        </div>

      </div>

      <!-- menu -->
      <ul class="dashboard-menu">

        <li>
          <img src="./images/loged-in/blog.jpg">
          Liked Blogs
        </li>

        <li>
          <img src="./images/loged-in/bubble-chat.jpg">
          Your Comments
        </li>

        <li>
          <img src="./images/loged-in/share-img.png">
          Shared Blogs
        </li>

        <li>
          <img src="./images/loged-in/contact-book.jpg">
          Contact Better Being
        </li>

        <li>
          <img src="./images/loged-in/notification.jpg">
          Notifications
        </li>

        <li>
          <img src="./images/loged-in/document-validation.jpg">
          Terms & Conditions
        </li>

      </ul>

    </div>
  </div>
</section>
</body>
</html>
